<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>이동 중 활동 기록 · WK6 사용성 테스트 반영 수정본</title>
  <link rel="preload" href="./assets/fonts/Pretendard-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./assets/fonts/Pretendard-Medium.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./assets/fonts/Pretendard-Light.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./assets/images/services/logos.png" as="image">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="workspace">
    <aside class="workbench" id="workbench" aria-label="프로토타입 시뮬레이션">
      <p class="wb-eyebrow">MID-FI WORKING PROTOTYPE · USABILITY TEST REVISED</p>
      <section class="wb-panel">
        <h2>연구자용 시뮬레이션 패널</h2>
        <p class="wb-copy">연구자용 도구입니다. 위치 감지, 푸시 알림, 탑승, 외부 앱 실행은 실제 기기 기능을 호출하지 않으며, 아래 버튼으로 상황을 재현합니다. 참가자에게는 이 패널 없이 주소 끝에 ?bare=1 을 붙여 보여 주세요.</p>
        <div class="wb-grid">
          <button type="button" data-action="sim-depart">출발 감지</button>
          <button type="button" data-action="sim-transfer">환승 직전</button>
          <button type="button" data-action="sim-boarding">탑승 감지</button>
          <button type="button" data-action="sim-destination">목적지 도착</button>
          <button type="button" data-action="end-use">이용 종료</button>
          <button type="button" data-action="sim-time">이동 시간 +10분</button>
        </div>
        <p class="wb-status" id="wb-status">현재 화면: 로그인</p>
        <p class="wb-status" id="wb-log">최근 조작: —</p>
      </section>
      <section class="wb-panel">
        <h2>사용자 상태</h2>
        <dl class="wb-flags" id="wb-flags"></dl>
        <div class="wb-actions">
          <button type="button" data-action="reset">처음부터 다시</button>
        </div>
      </section>
      <p class="wb-note">WK6 사용성 테스트 반영 수정본 · 설계 기준: Figma Mid-fi (402 × 874) · 로컬 목업 데이터</p>
    </aside>

    <main class="preview-area">
      <div class="device" id="device" data-screen="login" data-tone="white">
        <div class="status-bar" aria-label="상태바">
          <div class="sb-left"><span>8:34</span><img src="./assets/icons/login/location.svg" alt="" width="14" height="14"></div>
          <div class="sb-island" aria-hidden="true"></div>
          <div class="sb-right"><span class="sb-signal"><img src="./assets/icons/login/signal.svg" alt="" width="18.5" height="12.5"></span><img src="./assets/icons/login/wifi.svg" alt="Wi-Fi 연결됨" width="18" height="14"><img src="./assets/icons/login/battery.svg" alt="배터리 100%" width="27" height="14"></div>
        </div>
        <div id="island-layer"></div>
        <div id="app-screen" class="app-screen" role="main" aria-live="polite"></div>
        <div id="sheet-layer"></div>
        <div id="app-modal"></div>
        <div id="toast" class="toast" role="status"></div>
        <div class="home-indicator" aria-hidden="true"></div>
      </div>
    </main>
  </div>
  <script src="./core.js"></script>
  <script src="./screens-setup.js"></script>
  <script src="./screens-journey.js"></script>
  <script src="./screens-report.js"></script>
  <script src="./app.js"></script>
</body>
</html>
